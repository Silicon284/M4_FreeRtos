# ─── STEP 1: Debug Adapter ───────────────────────────────────────────────────
# Tells OpenOCD to use the ST-Link USB adapter.
# This sources: C:/GccArmToolchain/OpenOCD-20250710-0.12.0/share/openocd/scripts/interface/stlink.cfg
# IMPORTANT: This uses OpenOCD's NATIVE st-link driver (not the deprecated HLA driver).
# The native driver is what makes dual-core possible.
source C:/GccArmToolchain/OpenOCD-20250710-0.12.0/share/openocd/scripts/interface/stlink.cfg

# ─── STEP 2: Transport Protocol ──────────────────────────────────────────────
# Use SWD (Serial Wire Debug) — the 2-pin protocol on your board's debug header.
transport select swd

# ─── STEP 3: Chip Parameters ─────────────────────────────────────────────────
set CHIPNAME stm32h7x     ;# internal name used by the .cfg script
set DUAL_BANK 1           ;# STM32H745 has 2x1MB flash banks (0x08000000 and 0x08100000)
set DUAL_CORE 1           ;# Enable CM7 (cpu0, AP=0) + CM4 (cpu1, AP=3)

# Optional but recommended: Cross Trigger Interface — when CM7 hits a breakpoint,
# CM4 also halts automatically (and vice versa). Very useful for debugging
# inter-core communication.
# set USE_CTI 1

# ─── STEP 4: GDB Port Base ───────────────────────────────────────────────────
# OpenOCD assigns ports sequentially per target created. With the native st-link
# driver, stm32h7x.cfg creates THREE targets in this order:
#   1. stm32h7x.ap2  (mem_ap for trace registers) → gets port 3332
#   2. stm32h7x.cpu0 (CM7, cortex_m)              → gets port 3333  ← GDB connects here
#   3. stm32h7x.cpu1 (CM4, cortex_m)              → gets port 3334  ← GDB connects here
# Setting base to 3332 shifts the sequence so cpu0=3333 and cpu1=3334,
# matching your launch.json exactly.
gdb port 3333

# ─── STEP 5: Target Configuration ────────────────────────────────────────────
# Sources: .../scripts/target/stm32h7x.cfg
# This script reads DUAL_CORE and DUAL_BANK variables set above and creates
# the target objects, flash banks, and event handlers for both cores.
source C:/GccArmToolchain/OpenOCD-20250710-0.12.0/share/openocd/scripts/target/stm32h7x.cfg